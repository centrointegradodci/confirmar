<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Integrakids · Confirmação de agenda</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#F4F8F9;color:#263E43}
  .bar{display:flex;height:8px}.bar i{flex:1}
  .box{max-width:460px;margin:0 auto;padding:22px 18px 30px}
  h1{margin:6px 0 0;font-size:30px;letter-spacing:-.5px}h1 span{color:#7EB1BC}
  .sub{margin:2px 0 18px;color:#F1884C;font-weight:700;font-size:15px}
  .card{background:#fff;border-radius:14px;padding:14px 16px;border-left:6px solid #7EB1BC;box-shadow:0 1px 4px rgba(38,62,67,.08);margin-bottom:16px}
  .card b{font-size:20px;display:block}.card .q{color:#56696D;margin-top:2px}
  .card pre{font:15px/1.5 Arial,Helvetica,sans-serif;white-space:pre-wrap;margin:8px 0 0}
  .ja{background:#FFF8E1;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
  button{display:block;width:100%;border:0;border-radius:14px;padding:18px;font-size:19px;font-weight:700;margin:0 0 12px;cursor:pointer;color:#fff}
  .sim{background:#ACD5AF;color:#1F4A2A}.nao{background:#BDA8CC;color:#3E2A55}
  .sim:hover{background:#9CCB9F}.nao:hover{background:#B09BC2}
  button:disabled{opacity:.55}
  .ok{border-radius:14px;padding:18px;font-size:18px;font-weight:700;text-align:center;margin-bottom:12px}
  .ok.s{background:#E8F4E9;color:#1F4A2A}.ok.n{background:#F1ECF6;color:#3E2A55}.ok.e{background:#FFF8E1;color:#6B5A00;font-size:15px;font-weight:400}
  .pe{color:#6B7F83;font-size:13px;margin-top:18px;line-height:1.45}
  .ld{color:#6B7F83;font-size:14px;margin:6px 0 14px}
</style>
</head>
<body>
<div class="bar"><i style="background:#7EB1BC"></i><i style="background:#ACD5AF"></i><i style="background:#BDA8CC"></i><i style="background:#F1884C"></i><i style="background:#F5E764"></i><i style="background:#E2524E"></i></div>
<div class="box">
  <h1><span>Integra</span>kids</h1>
  <p class="sub">Confirmação de agenda</p>
  <div id="cv"></div>
  <div id="ja"></div>
  <div id="ok"></div>
  <div id="bt" hidden>
    <button class="sim" data-r="sim">SIM, vamos</button>
    <button class="nao" data-r="nao">NÃO poderemos ir</button>
  </div>
  <p class="ld" id="ld">Carregando…</p>
  <p class="pe">Agenda terapêutica fechada: o horário é reservado para a criança. Dúvidas? Fale com a recepção pelo WhatsApp.</p>
</div>
<script>
  /* endereço do app da Web da clínica (Google Apps Script) */
  var EXEC = 'https://script.google.com/macros/s/AKfycbyeEdYKgi0UwGIWvSZ9o9a_EdxqC4vgvRt1_Nevdkqey54yhMSR0f8FTLoIqs41mlo1/exec';
  var C = (new URLSearchParams(location.search).get('c') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 24);
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function msg(cls, t) { var o = $('ok'); o.className = 'ok ' + cls; o.textContent = t; }
  /* JSONP: a resposta do Google volta como script (o navegador não bloqueia, ao contrário do fetch) */
  var N = 0;
  function pega(q) {
    return new Promise(function (ok, falha) {
      var nome = '__ik' + (++N) + '_' + Date.now(), s = document.createElement('script'), fim = false;
      var limpa = function () { fim = true; try { delete window[nome]; } catch (e) { window[nome] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); };
      window[nome] = function (j) { if (fim) return; limpa(); ok(j); };
      s.onerror = function () { if (fim) return; limpa(); falha(new Error('rede')); };
      setTimeout(function () { if (fim) return; limpa(); falha(new Error('tempo')); }, 20000);
      s.src = EXEC + '?' + q + '&cb=' + nome + '&_=' + Date.now();
      document.body.appendChild(s);
    });
  }
  if (!C) { $('ld').hidden = true; msg('e', 'Este link está incompleto. Por favor, responda pela conversa do WhatsApp com a recepção.'); }
  else {
    pega('a=conv&t=' + C).then(function (j) {
      $('ld').hidden = true; $('bt').hidden = false;
      if (j && j.cv) $('cv').innerHTML = '<div class="card"><b>' + esc(j.cv.n) + '</b><div class="q">' + esc(j.cv.q) + '</div><pre>' + esc(j.cv.s) + '</pre></div>';
      if (j && j.ul) $('ja').innerHTML = '<div class="ja">Já recebemos sua resposta: <b>' + (j.ul.r === 'nao' ? 'NÃO poderemos ir' : 'SIM, vamos') + '</b>. Se precisar, pode mudar abaixo.</div>';
    }).catch(function () { $('ld').hidden = true; $('bt').hidden = false; });
    Array.prototype.forEach.call(document.querySelectorAll('#bt button'), function (b) {
      b.onclick = function () {
        var r = b.getAttribute('data-r'), L = document.querySelectorAll('#bt button');
        for (var i = 0; i < L.length; i++) L[i].disabled = true;
        pega('a=r&t=' + C + '&r=' + r).then(function (j) {
          if (!j || !j.ok) throw new Error('falha');
          $('bt').hidden = true; $('ja').innerHTML = '';
          msg(j.r === 'nao' ? 'n' : 's', j.r === 'nao' ? 'Recebemos o seu aviso. A recepção vai falar com você pelo WhatsApp.' : 'Obrigado! Presença confirmada. Até lá!');
        }).catch(function () {
          for (var i = 0; i < L.length; i++) L[i].disabled = false;
          msg('e', 'Não foi possível registrar agora. Tente de novo em instantes ou responda pelo WhatsApp.');
        });
      };
    });
  }
</script>
</body>
</html>
